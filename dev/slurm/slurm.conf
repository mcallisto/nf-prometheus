# Minimal single-node Slurm configuration for container testing.
ClusterName=nfdev
SlurmctldHost=slurmnode

AuthType=auth/munge
SlurmUser=slurm
ReturnToService=2

# Container-friendly process tracking (no cgroups)
ProctrackType=proctrack/pgid
TaskPlugin=task/none
# pgid tracking in containers can be slow to reap task groups; without this
# slurmd drains the node with "Kill task failed" after successful jobs
UnkillableStepTimeout=120

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

NodeName=slurmnode CPUs=4 RealMemory=4000 State=UNKNOWN
PartitionName=main Nodes=ALL Default=YES MaxTime=INFINITE State=UP
