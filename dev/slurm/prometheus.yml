global:
  scrape_interval: 5s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: pushgateway
    # keep the labels pushed by the pipeline (run_name, job) instead of
    # rewriting them as exported_*
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
